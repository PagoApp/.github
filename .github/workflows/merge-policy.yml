name: Merge Policy

# Reusable workflow: platform-specialist merge gate + mandatory gadgetlab report check.
# Called from ios-pago / android-pago / ios-sdks / android-sdks via a thin caller workflow.
# Roster of platform specialists lives in policy/roster.json in THIS repo (PagoApp/.github),
# fetched via the Contents API so no checkout of the calling repo is needed.

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PLATFORM_BY_REPO = {
              'ios-pago': 'ios',
              'ios-sdks': 'ios',
              'android-pago': 'android',
              'android-sdks': 'android',
            };
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const platform = PLATFORM_BY_REPO[repo];
            if (!platform) {
              core.setFailed(`No platform mapping for repo ${repo} — add it to PLATFORM_BY_REPO in PagoApp/.github/.github/workflows/merge-policy.yml`);
              return;
            }

            let prNumber;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.info('Comment is not on a pull request, skipping.');
                return;
              }
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headSha = pr.head.sha;
            const author = pr.user.login;

            const rosterRes = await github.rest.repos.getContent({
              owner: 'PagoApp', repo: '.github', path: 'policy/roster.json',
            });
            const roster = JSON.parse(Buffer.from(rosterRes.data.content, 'base64').toString('utf8'));
            const specialists = roster[platform] || [];
            const isSpecialist = specialists.includes(author);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const latestByUser = {};
            for (const r of reviews) {
              if (r.commit_id !== headSha) continue; // ignore reviews on stale commits
              latestByUser[r.user.login] = r; // API returns ascending order; last write wins
            }

            const puddyReview = latestByUser['puddybot'];
            const puddyOk = !!puddyReview && puddyReview.state === 'APPROVED';

            let conclusion, title, summary;
            if (!puddyOk) {
              conclusion = 'failure';
              title = 'Waiting on puddybot';
              summary = 'Needs an up-to-date APPROVED review from puddybot on the current commit.';
            } else if (isSpecialist) {
              conclusion = 'success';
              title = 'Merge policy satisfied';
              summary = `${author} is a ${platform} platform specialist — puddybot approval is sufficient to merge.`;
            } else {
              const specialistApproval = Object.entries(latestByUser).find(
                ([login, r]) => login !== author && specialists.includes(login) && r.state === 'APPROVED'
              );
              if (specialistApproval) {
                conclusion = 'success';
                title = 'Merge policy satisfied';
                summary = `puddybot approved, plus ${platform} specialist ${specialistApproval[0]} approved.`;
              } else {
                conclusion = 'failure';
                title = 'Needs a platform specialist approval';
                summary = `${author} is not on the ${platform} specialist list, so puddybot alone is not enough. `
                  + `Needs an approval from one of: ${specialists.join(', ')}.`;
              }
            }

            await github.rest.checks.create({
              owner, repo, name: 'policy/merge-gate', head_sha: headSha,
              status: 'completed', conclusion,
              output: { title, summary },
            });

  gadgetlab-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            let prNumber;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.info('Comment is not on a pull request, skipping.');
                return;
              }
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const reportLinkPattern = /https:\/\/[^\s)]*diricrawls\.ro[^\s)]*/i;
            const hasReport = comments.some(c => reportLinkPattern.test(c.body || ''));

            await github.rest.checks.create({
              owner, repo, name: 'policy/gadgetlab-report', head_sha: pr.head.sha,
              status: 'completed', conclusion: hasReport ? 'success' : 'failure',
              output: {
                title: hasReport ? 'Gadget lab report found' : 'Missing gadget lab report',
                summary: hasReport
                  ? 'Found a report-hub (diricrawls.ro) link in a PR comment.'
                  : 'No gadget lab report link found in PR comments. Run the /gadget-mobile-report skill and post the published report link as a PR comment before merging.',
              },
            });
